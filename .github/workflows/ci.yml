name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  # The real-server stdio job below is network-dependent, so it is not a PR
  # gate. Dispatch it by hand or let the weekly schedule catch spec drift.
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  build-lint-test:
    name: Build, Lint, Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        # Must satisfy go.mod (go 1.25.0, toolchain go1.26.5). setup-go v7
        # exports GOTOOLCHAIN=local, so Go will no longer auto-switch to the
        # toolchain directive; the installed version is the one that runs.
        go:
          - "1.26.x"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download dependencies
        run: go mod download

      # gofumpt is a strict superset of gofmt, so this replaces a plain
      # gofmt check. The version is pinned in the Makefile so local runs
      # and CI check exactly the same rules.
      - name: Verify formatting (gofumpt)
        run: make fmt-check

      # Pinned deliberately (same version as release.yml) so CI cannot
      # start failing on files nobody edited when a new golangci-lint
      # release tightens rules (issue #17). Action itself bumped to v9
      # to avoid Node 20 deprecation (issue #30); bump this version
      # via PR.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m

      - name: Run unit tests
        run: make unit

      - name: Run integration tests
        run: make integration

      - name: Build binary
        run: go build ./cmd/ocd-smoke-alarm

      # The release archives windows/{amd64,arm64} (issue #58). A host build
      # never type-checks the `//go:build windows` half of the tree, so a
      # unix-only syscall in a shared package stays invisible until a tag is
      # pushed. Cross-compiling costs seconds: the compiler runs, the linker
      # does not, and nothing is executed. One OS is enough — the output does
      # not depend on the host.
      - name: Compile for Windows
        if: matrix.os == 'ubuntu-latest'
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=arm64 go build ./...

  # Issue #43: the mock proves the prober agrees with itself; this job proves it
  # agrees with a real, spec-compliant MCP stdio server. It shells out to `npx`,
  # which fetches @modelcontextprotocol/server-filesystem from the npm registry,
  # so it runs only on dispatch or on the weekly schedule — never as a PR gate.
  stdio-real-mcp:
    name: Real stdio MCP handshake (network)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      # The sample's 5s probe timeout starts when the child is spawned, so a
      # cold `npx -y` install would blow it. Warm the cache first: whatever exit
      # path this takes, the package is on disk by the time the probe runs.
      - name: Warm the npx cache
        run: timeout 180 npx -y @modelcontextprotocol/server-filesystem --help || true

      # This is the command the README advertises. Non-zero exit means the
      # advertised stdio strict smoke does not work against a real server.
      - name: Stdio MCP strict smoke (real server)
        run: go run ./cmd/ocd-smoke-alarm check --config=configs/samples/stdio-mcp-strict.yaml

