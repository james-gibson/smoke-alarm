name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-lint-test:
    name: Build, Lint, Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        go:
          - "1.22.x"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download dependencies
        run: go mod download

      # gofumpt is a strict superset of gofmt, so this replaces a plain
      # gofmt check. The version is pinned in the Makefile so local runs
      # and CI check exactly the same rules.
      - name: Verify formatting (gofumpt)
        run: make fmt-check

      # Pinned deliberately: `version: latest` let gofumpt drift change CI
      # behaviour with no repo change and broke the release gate on files
      # nobody edited (issue #17). Bump via PR instead.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          args: --timeout=5m

      - name: Run unit tests
        run: make unit

      - name: Run integration tests
        run: make integration

      - name: Build binary
        run: go build ./cmd/ocd-smoke-alarm
