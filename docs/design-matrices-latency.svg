<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="476" viewBox="0 0 1010 476" font-family="ui-monospace, SFMono-Regular, monospace">
<rect width="1010" height="476" fill="#ffffff"/>
<text x="18" y="32" font-size="17" font-weight="bold">Detection latency vs load</text>
<text x="18" y="52" font-size="10" fill="#555">Log scale, seconds. Sample-based checks accelerate with load; turn-based checks do not.</text>
<line x1="240.0" y1="88" x2="240.0" y2="326" stroke="#e2e2e2"/>
<text x="240.0" y="344" font-size="9" text-anchor="middle" fill="#666">0.1s</text>
<line x1="360.3" y1="88" x2="360.3" y2="326" stroke="#e2e2e2"/>
<text x="360.3" y="344" font-size="9" text-anchor="middle" fill="#666">0.5s</text>
<line x1="412.1" y1="88" x2="412.1" y2="326" stroke="#e2e2e2"/>
<text x="412.1" y="344" font-size="9" text-anchor="middle" fill="#666">1s</text>
<line x1="532.4" y1="88" x2="532.4" y2="326" stroke="#e2e2e2"/>
<text x="532.4" y="344" font-size="9" text-anchor="middle" fill="#666">5s</text>
<line x1="584.2" y1="88" x2="584.2" y2="326" stroke="#e2e2e2"/>
<text x="584.2" y="344" font-size="9" text-anchor="middle" fill="#666">10s</text>
<line x1="704.6" y1="88" x2="704.6" y2="326" stroke="#e2e2e2"/>
<text x="704.6" y="344" font-size="9" text-anchor="middle" fill="#666">50s</text>
<line x1="756.4" y1="88" x2="756.4" y2="326" stroke="#e2e2e2"/>
<text x="756.4" y="344" font-size="9" text-anchor="middle" fill="#666">100s</text>
<line x1="860.0" y1="88" x2="860.0" y2="326" stroke="#e2e2e2"/>
<text x="860.0" y="344" font-size="9" text-anchor="middle" fill="#666">400s</text>
<text x="226" y="118" font-size="10" text-anchor="end" fill="#111">bias test, side bias 0.9</text>
<rect x="240" y="102" width="391.4" height="14" fill="#b8860b" fill-opacity="0.9"/>
<text x="637.4" y="113" font-size="9" fill="#333">18.8s (1/s)</text>
<rect x="240" y="120" width="115.5" height="14" fill="#2f7d4f" fill-opacity="0.9"/>
<text x="361.5" y="131" font-size="9" fill="#333">0.469s (40/s)</text>
<text x="226" y="164" font-size="10" text-anchor="end" fill="#111">helix, 10 turns</text>
<rect x="240" y="148" width="464.6" height="14" fill="#b8860b" fill-opacity="0.9"/>
<text x="710.6" y="159" font-size="9" fill="#333">50s (1/s)</text>
<rect x="240" y="166" width="464.6" height="14" fill="#2f7d4f" fill-opacity="0.9"/>
<text x="710.6" y="177" font-size="9" fill="#333">50s (40/s)</text>
<text x="226" y="210" font-size="10" text-anchor="end" fill="#111">canary saturation</text>
<rect x="240" y="194" width="598.5" height="14" fill="#b8860b" fill-opacity="0.9"/>
<text x="844.5" y="205" font-size="9" fill="#333">300s (1/s)</text>
<rect x="240" y="212" width="287.8" height="14" fill="#2f7d4f" fill-opacity="0.9"/>
<text x="533.8" y="223" font-size="9" fill="#333">4.7s (40/s)</text>
<text x="226" y="256" font-size="10" text-anchor="end" fill="#111">golden rebuild</text>
<rect x="240" y="240" width="127.4" height="14" fill="#b8860b" fill-opacity="0.9"/>
<text x="373.4" y="251" font-size="9" fill="#333">0.55s (1/s)</text>
<rect x="240" y="258" width="127.4" height="14" fill="#2f7d4f" fill-opacity="0.9"/>
<text x="373.4" y="269" font-size="9" fill="#333">0.55s (40/s)</text>
<text x="226" y="302" font-size="10" text-anchor="end" fill="#111">hydration spawn</text>
<rect x="240" y="286" width="127.4" height="14" fill="#b8860b" fill-opacity="0.9"/>
<text x="373.4" y="297" font-size="9" fill="#333">0.55s (1/s)</text>
<rect x="240" y="304" width="127.4" height="14" fill="#2f7d4f" fill-opacity="0.9"/>
<text x="373.4" y="315" font-size="9" fill="#333">0.55s (40/s)</text>
<line x1="18" y1="358" x2="992" y2="358" stroke="#999"/>
<rect x="18" y="370" width="14" height="12" fill="#b8860b" fill-opacity="0.9"/>
<text x="38" y="380" font-size="10" fill="#333">at 1 probe/s</text>
<rect x="150" y="370" width="14" height="12" fill="#2f7d4f" fill-opacity="0.9"/>
<text x="170" y="380" font-size="10" fill="#333">at 40 probes/s (the per-claimant ceiling)</text>
<text x="18" y="404" font-size="10" fill="#555">Only the bias test and the canary improve with load: they convert samples into evidence. The helix is a schedule, so its latency is turns x epoch.</text>
</svg>